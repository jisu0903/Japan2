<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 교과서 암기</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f2f2f2;
}

/* 화면 */
.screen{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}
.active{
    display:flex;
}

/* 메뉴 버튼 */
.menu-btn{
    width:260px;
    padding:18px;
    margin:10px;
    font-size:20px;
    border:none;
    border-radius:15px;
    background:white;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    cursor:pointer;
}

/* 카드 */
#card{
    width:320px;
    height:220px;
    background:white;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    cursor:pointer;
    padding:20px;
}

.question{
    font-size:68px;
    font-weight:bold;
}

.kana{
    font-size:32px;
    color:#1976d2;
    font-weight:bold;
}

.meaning{
    font-size:22px;
    margin-top:10px;
}

/* 뒤로 버튼 */
.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-size:14px;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
    cursor:pointer;
}

/* 이전 사이트 버튼 */
.old-site-btn{
    width:260px;
    padding:14px;
    margin:10px;
    font-size:16px;
    border:none;
    border-radius:15px;
    background:#e8e8e8;
    box-shadow:0 3px 8px rgba(0,0,0,.12);
    cursor:pointer;
}
</style>
</head>

<body>

<!-- ======================
     메인 메뉴
====================== -->

<div id="menu" class="screen active">

    <h2>📚 일본어 교과서 암기</h2>

    <button class="menu-btn" onclick="startMode('intro')">
        도입
    </button>

    <button class="menu-btn" onclick="startMode('lesson1')">
        1과
    </button>

    <button class="menu-btn" onclick="startMode('lesson2')">
        2과
    </button>

    <button class="menu-btn" onclick="startMode('lesson3')">
        3과
    </button>

    <button class="menu-btn" onclick="startMode('all')">
    전체 연습
    </button>

    <button class="menu-btn" onclick="startMode('other')">
        기타 한자
    </button>

    <button class="old-site-btn" onclick="goToOldSite()">
        ↗ 이전 일본어 암기 사이트
    </button>

</div>


<!-- ======================
     학습 화면
====================== -->

<div id="study" class="screen">

    <button class="back-btn" onclick="backMenu()">
        ← 메뉴
    </button>

    <div id="card"></div>

</div>


<script>

/* ======================
   1과

====================== */

const lesson1Words = [
["香川県","かがわけん","가가와현"],
["立ち食い","たちぐい","서서 먹기"],
["待つ","まつ","기다리다"],

["お願い","おねがい","부탁"],

/* ======================
   2과
   나중에 단어 추가
====================== */

const lesson2Words = [
["着物","きもの","기모노"],
["物","もの","물건"],
["和服","わふく","일본 전통 의복"],
["白無垢","しろむく","시로무쿠"],
["色打掛","いろうちかけ","이로우치카케"],
["訪問着","ほうもんぎ","호몬기"],
["訪問","ほうもん","방문"],

["上手","じょうず","능숙함, 잘함"],

["成人式","せいじんしき","성인식"]
];

/* ======================
   3과
   나중에 단어 추가
====================== */

const lesson3Words = [
["一戸建て","いっこだて","단독주택"],
["和室","わしつ","일본식 방"],
["畳","たたみ","다다미, 조"],
["和紙","わし","일본 전통 종이"],
["絵","え","그림"],
["先","さき","앞, 먼저"],
["服","ふく","옷"],
["試着","しちゃく","착용해 봄, 시착"],
["降","おりる","내리다"],
["上","あがる","오르다"],
["広告","こうこく","광고"],
["連絡","れんらく","연락"],
["質問","しつもん","질문"],
["近","ちかい","가깝다"],
["歩","あるく","걷다"],
["駐車場","ちゅうしゃじょう","주차장"],
["車","くるま","자동차"],
["広","ひろい","넓다"]
];


/* ======================
   기타 한자
   나중에 단어 추가
====================== */

const otherWords = [

];


/* ======================
   전체 연습
====================== */

const allWords = [
    ...introWords,
    ...lesson1Words,
    ...lesson2Words,
    ...lesson3Words,
    ...otherWords
];


/* ======================
   상태
====================== */

let currentSet = [];
let currentWord = null;
let showingAnswer = false;
let remainingWords = [];
    
const card = document.getElementById("card");


/* ======================
   메뉴 이동
====================== */

function backMenu(){

    document.getElementById("study").classList.remove("active");

    document.getElementById("menu").classList.add("active");

}


/* ======================
   모드 선택
====================== */

function startMode(mode){

    document.getElementById("menu").classList.remove("active");

    document.getElementById("study").classList.add("active");
    remainingWords = [];

    if(mode === "intro"){
        currentSet = introWords;
    }

    else if(mode === "lesson1"){
        currentSet = lesson1Words;
    }

    else if(mode === "lesson2"){
        currentSet = lesson2Words;
    }

    else if(mode === "lesson3"){
        currentSet = lesson3Words;
    }

    else if(mode === "other"){
        currentSet = otherWords;
    }
        
    else if(mode === "all"){
    currentSet = allWords;
}


    showQuestion();

}


/* ======================
   랜덤 단어
====================== */

function randomWord(){

    if(remainingWords.length === 0){

        remainingWords = [...currentSet];

        for(let i = remainingWords.length - 1; i > 0; i--){

            const j = Math.floor(Math.random() * (i + 1));

            [remainingWords[i], remainingWords[j]] =
            [remainingWords[j], remainingWords[i]];
        }
    }

    return remainingWords.pop();
}


/* ======================
   문제 표시
====================== */

function showQuestion(){

    if(currentSet.length === 0){

        card.innerHTML =
        `<div class="meaning">
            아직 단어가 없습니다.
        </div>`;

        currentWord = null;
        showingAnswer = false;

        return;
    }


    currentWord = randomWord();

    card.innerHTML =
    `<div class="question">
        ${currentWord[0]}
    </div>`;

    showingAnswer = false;

}


/* ======================
   정답 표시
====================== */

function showAnswer(){

    card.innerHTML =

    `<div class="kana">
        ${currentWord[1]}
    </div>

     <div class="meaning">
        ${currentWord[2]}
     </div>`;

    showingAnswer = true;

}


/* ======================
   카드 터치
====================== */

card.addEventListener("click", ()=>{

    if(!currentWord) return;

    if(showingAnswer){

        showQuestion();

    }

    else{

        showAnswer();

    }

});


/* ======================
   이전 사이트 이동
====================== */

function goToOldSite(){

    window.location.href =
    "https://jisu0903.github.io/Doubleslit/";

}

</script>
